<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>{{ site_name }} -- Panel</title>
  <style>
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0d1117; color: #e6edf3; margin: 0; padding: 60px; }
    .box { max-width: 480px; margin: 0 auto; background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 32px; text-align: center; }
    h1 { font-size: 20px; }
    a { color: #2f81f7; text-decoration: none; font-size: 13px; }
  </style>
</head>
<body>
  <div class="box">
    <h1>✅ Signed in to {{ site_name }}</h1>
    <p style="color:#7d8590; font-size: 13px;">This is a fake admin panel -- it only exists to prove the login worked.</p>
    <a href="/logout">Log out</a>
  </div>
</body>
</html>
